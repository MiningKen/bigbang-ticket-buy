<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>寬宏搶票助手</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">BIGBANG KAOHSIUNG · GENERAL SALE</p>
          <h1>寬宏搶票控制台</h1>
        </div>
        <span id="runningBadge" class="badge neutral">未啟動</span>
      </header>

      <section class="status-grid" aria-label="即時狀態">
        <article>
          <span>會員</span>
          <strong id="loginStatus">尚未確認</strong>
        </article>
        <article>
          <span>票況</span>
          <strong id="ticketStatus">尚未啟動</strong>
        </article>
        <article class="wide">
          <span>目前動作</span>
          <strong id="phaseStatus">尚未啟動</strong>
          <small id="salePlan"></small>
        </article>
      </section>

      <section class="log-panel" aria-label="已鎖定設定">
        <div class="log-title">已鎖定設定</div>
        <ol id="settings">
          <li>載入中</li>
        </ol>
      </section>

      <form id="preferenceForm">
        <div class="field">
          <label for="ticketMode">票數模式</label>
          <select id="ticketMode" name="ticketMode">
            <option value="single">1 張</option>
            <option value="adjacent-two-then-one">2 張連號優先，失敗則 1 張</option>
          </select>
          <small>兩張只接受連號；2/28、2/27 都無連號後才會改搶單張。</small>
        </div>
      </form>

      <form id="cardPrefixForm" autocomplete="off">
        <div class="field">
          <label for="cardPrefix">中信卡號前 6 碼</label>
          <input
            id="cardPrefix"
            type="password"
            inputmode="numeric"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            placeholder="僅暫存在本次執行的記憶體"
            required
          />
          <small id="cardPrefixStatus">尚未暫存；不會寫入設定檔或操作紀錄。</small>
        </div>
        <button class="secondary" type="submit">安全暫存 6 碼</button>
      </form>

      <div class="actions">
        <button id="openLogin" class="secondary">開啟登入頁</button>
        <button id="start" class="primary">開始等待 9/22 10:00</button>
        <button id="stop" class="danger">停止</button>
      </div>

      <section class="log-panel">
        <div class="log-title">操作紀錄</div>
        <ol id="logs"><li>等待啟動</li></ol>
      </section>
      <p id="toast" role="status"></p>
    </main>

    <div id="alertOverlay" class="overlay" hidden>
      <section class="alert-card" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
        <div class="pulse"></div>
        <p class="eyebrow">需要你立即處理</p>
        <h2 id="alertTitle">寬宏購票流程</h2>
        <p id="alertMessage"></p>
        <button id="focusTicket" class="primary">切換到寬宏視窗</button>
        <button id="dismissAlert" class="secondary">關閉提示</button>
      </section>
    </div>
    <script src="/kham-app.js" type="module"></script>
  </body>
</html>
